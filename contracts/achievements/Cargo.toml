[package]
name = "achievements"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fund-My-Cause achievements and NFT badges smart contract for the Stellar/Soroban network"
documentation = "https://fund-my-cause.github.io/Fund-My-Cause/achievements"
readme = "../../README.md"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
common = { path = "../common", features = ["testutils"] }
proptest = "1.4"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
# Soroban contract entrypoints and generated code commonly trigger these.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"