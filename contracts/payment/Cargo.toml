[package]
name = "payment"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fund-My-Cause payment escrow contract — lock, release, and fee-split payments on the Stellar/Soroban network"
documentation = "https://fund-my-cause.github.io/Fund-My-Cause/payment"
readme = "../../README.md"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

# docs.rs configuration
[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--cfg", "docsrs",
  "--default-theme=ayu",
]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
