[package]
name = "crowdfund"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fund-My-Cause crowdfunding smart contract for the Stellar/Soroban network"
documentation = "https://fund-my-cause.github.io/Fund-My-Cause/crowdfund"
readme = "../../README.md"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

# docs.rs configuration — enables all features and sets rustdoc flags
[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--cfg", "docsrs",
  "--document-private-items",
  "--default-theme=ayu",
]

[features]
fuzz = []

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
common = { path = "../common", features = ["testutils"] }
proptest = "1.4"

# Inherit the workspace-level clippy pedantic configuration (issue #1162).
# Contract-specific exceptions are documented with #[allow] in the source.
[lints]
workspace = true
