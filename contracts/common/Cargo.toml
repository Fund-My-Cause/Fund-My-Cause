[package]
name = "common"
version = "0.1.0"
edition = "2021"

[features]
# Exposes `test_utils` to downstream contract test suites.
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
proptest = "1.4"

[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Allow pedantic lints that are noisy or not actionable in contract code.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lib]
crate-type = ["cdylib", "rlib"]