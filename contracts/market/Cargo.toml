[package]
name = "market"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fund-My-Cause market contract — tipping and escrow on the Stellar/Soroban network"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
