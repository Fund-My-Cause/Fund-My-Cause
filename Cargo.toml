[workspace]
resolver = "2"
members = [
  "contracts/*",
]
exclude = ["contracts/benchmarks"]

[workspace.metadata.docs]
# Run `cargo doc --workspace --no-deps --document-private-items` to build docs locally.
# The GitHub Actions workflow `.github/workflows/docs.yml` builds and deploys to GitHub Pages.
output-dir = "target/doc"

[workspace.dependencies]
soroban-sdk = "25.3.0"

# Workspace-wide lint policy.
#
# Each contract crate opts in by adding the following to its Cargo.toml:
#
#   [lints]
#   workspace = true
#
# This keeps lint configuration centralized and consistent across all
# contracts while allowing individual crates to opt in explicitly.
#
# Policy:
# - Rust warnings are denied so that any compiler warning fails the build.
# - Clippy's `pedantic` group is enabled to catch maintainability issues.
# - A small set of pedantic lints that are noisy or not meaningful for
#   on-chain contract code are explicitly allowed below.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# `missing_errors_doc` / `missing_panics_doc` are overly noisy for internal
# contract helpers; document behavior where it matters instead.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Numeric casts are common and intentional in contract arithmetic.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
# Module-level docs are not required for every internal module.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Contract entry points are exported and used externally; allow unused self.
unused_self = "allow"

[profile.release]
# Optimized for minimal WASM binary size:
# opt-level="z" minimizes code size; lto eliminates dead code; codegen-units=1
# enables full optimization; panic="abort" avoids unwind info; strip="symbols"
# removes debug symbols; overflow-checks=false reduces runtime overhead
# (contracts use checked_mul/checked_div for safety instead).
opt-level = "z"
overflow-checks = false
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true