[workspace]
resolver = "2"
members = [
  "contracts/*",
]
exclude = ["contracts/benchmarks"]

[workspace.metadata.docs]
# Run `cargo doc --workspace --no-deps --document-private-items` to build docs locally.
# The GitHub Actions workflow `.github/workflows/docs.yml` builds and deploys to GitHub Pages.
output-dir = "target/doc"

[workspace.dependencies]
soroban-sdk = "25.3.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# ── Workspace-wide lint configuration ────────────────────────────────────────
# Issue #1162: Add clippy lint enforcement with pedantic rules for contracts/*
[workspace.lints.clippy]
# Pedantic lints — catches subtle bugs and style issues across the whole
# workspace.  Priority = -1 so that individual crate-level `[lints]` entries
# that set a lint to "allow" can still override this baseline.
pedantic = { level = "warn", priority = -1 }
# Wildcard imports make it hard to know where names come from; deny them
# unconditionally so the contract's public surface stays auditable.
wildcard_imports = "deny"
